<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拍摄器材报价系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231f2937'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fbbf24'%3E%E6%91%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=20261107m">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">摄</div>
      <div class="brand-text">
        <h1>拍摄器材报价系统</h1>
        <p id="top-sub">下单报价 · 本地版，数据只保存在这台电脑</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="主导航"></nav>
    <div class="top-actions">
      <button class="btn ghost" id="btn-new" title="新建空白项目">新建</button>
      <button class="btn ghost" id="btn-save" title="保存到历史项目">保存</button>
      <button class="btn ghost" id="btn-mode" title="切换界面">数据统计 →</button>
      <button class="btn primary" id="btn-export-main" title="导出">导出报价单</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="statusbar">
    <span id="storage-status" class="status">正在检查本机存储…</span>
    <span id="draft-status" class="status"></span>
    <span id="meta-status" class="status muted"></span>
    <span id="mode-status" class="status muted"></span>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script src="vendor/exceljs.min.js"></script>
<script src="data/app-data.js?v=20261107m"></script>
<script src="js/model.js?v=20261107m"></script>
<script src="js/export.js?v=20261107m"></script>
<script src="js/app.js?v=20261107m"></script>
</body>
</html>
