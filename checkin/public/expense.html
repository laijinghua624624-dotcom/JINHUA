<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>现场凭证上传</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="wrap">
  <div class="mtabs"><a href="/m">打卡凭证</a><a class="on" href="/expense">报销凭证</a></div>
  <div class="head"><h1 id="project">交通费报销</h1><p>填车费、拍票据照片，提交后自动汇总到管理页</p></div>
  <div id="formCard">
    <div class="card">
      <label class="f">日期</label><input type="date" id="date">
      <label class="f">部门 / 组</label><select id="dept"></select>
      <label class="f">职位</label><select id="role"></select>
      <label class="f">姓名</label><input type="text" id="name" placeholder="请输入你的姓名" autocomplete="off">
    </div>
    <div class="card">
      <label class="f">费用类型</label>
      <div class="types">
        <label class="type on"><input type="radio" name="etype" value="equipment" checked>器材运输</label>
        <label class="type"><input type="radio" name="etype" value="ride">网约车</label>
      </div>
      <label class="f">同乘人（可选，避免重复报销）</label>
      <input type="text" id="passengers" placeholder="多个姓名用逗号分隔，例如：肖家乐, 颜永特">
    </div>
    <div class="card">
      <label class="f">费用（元）</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><label class="f" style="margin-top:0">前往费用</label><input type="number" inputmode="decimal" id="goCost" value="0" step="0.01" min="0"></div>
        <div><label class="f" style="margin-top:0">离开费用</label><input type="number" inputmode="decimal" id="leaveCost" value="0" step="0.01" min="0"></div>
        <div><label class="f" style="margin-top:0">停车费</label><input type="number" inputmode="decimal" id="parking" value="0" step="0.01" min="0"></div>
        <div><label class="f" style="margin-top:0">过路费</label><input type="number" inputmode="decimal" id="toll" value="0" step="0.01" min="0"></div>
      </div>
      <p class="hint">小计：<b id="subtotal">¥0.00</b>　（金额可以先不填，上传截图后系统会自动识别）</p>
      <label class="f">报销凭证（截图 / 票据照片）</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="shoot" id="uploadBtn" style="background:#2563eb">📤 上传截图</button>
        <button class="shoot" id="shootBtn">📷 拍照</button>
      </div>
      <input type="file" id="file" accept="image/*" style="display:none">
      <input type="file" id="camera" accept="image/*" capture="environment" style="display:none">
      <img class="preview" id="preview" alt="预览">
      <p class="hint">网约车行程、支付记录等截图直接从相册/文件上传即可。</p>
      <label class="f">备注（可选）</label><textarea id="note" placeholder="例如：3 人拼车 / 与某某同车"></textarea>
      <div class="err" id="err"></div>
    </div>
  </div>
  <div class="ok" id="okView">
    <div class="big">✅</div><h2>报销提交成功</h2><p id="okInfo"></p>
    <button id="againBtn">继续提交</button>
  </div>
</div>
<div class="submit"><button id="submitBtn" disabled>提交报销</button></div>
<script src="/expense.js"></script>
</body></html>
