services:
  lance:
    build:
      context: ../..
      dockerfile: Dockerfile.render
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "10000"
      RENDER_EXTERNAL_URL: ${PUBLIC_URL}
      LANCE_PUBLIC_ORIGIN: ${PUBLIC_URL}
      LANCE_ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    volumes:
      - lance_data:/data
    expose:
      - "10000"

  # 现场打卡 / 报销上传（原本机 Node 8137），与主站同域，由 Caddy 按路径分流。
  # 数据（照片、记录）落在 checkin_data 卷；公网地址靠 PUBLIC_BASE_URL 生成分享链接。
  checkin:
    build:
      context: ../../checkin
    restart: unless-stopped
    environment:
      PORT: "8137"
      PUBLIC_BASE_URL: ${PUBLIC_URL}
    volumes:
      - checkin_data:/app/data
    expose:
      - "8137"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - lance
      - checkin
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  lance_data:
  checkin_data:
  caddy_data:
  caddy_config:
