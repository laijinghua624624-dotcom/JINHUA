services:
  - type: web
    name: lance-content-studio
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    region: singapore
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: ARK_API_KEY
        sync: false
      - key: ARK_DIRECTOR_MODEL
        sync: false
      - key: ARK_REFINE_MODEL
        sync: false
      - key: ARK_IMAGE_MODEL
        sync: false
      - key: ARK_VIDEO_MODEL
        sync: false
      - key: ARK_EMBEDDING_MODEL
        sync: false
      - key: PINTEREST_APP_ID
        sync: false
      - key: PINTEREST_APP_SECRET
        sync: false
      - key: PINTEREST_REDIRECT_URI
        sync: false
      - key: PINTEREST_ACCESS_TOKEN
        sync: false
      - key: SPEECH_RESOURCE_ID
        value: volc.seedasr.auc
